# Daily portfolio summary email (SendGrid).
# Repo layout: repository root = this folder (main.py, daily_summary.py, requirements-prod.txt at root).
name: Daily portfolio summary

on:
  schedule:
    # Target: 10:30 Mon–Fri in Australia/Melbourne (weekday mornings).
    # GitHub cron is UTC-only. During AEDT (Melbourne UTC+11, ~first Sun Oct → first Sun Apr):
    #   Sun–Thu 23:30 UTC → Mon–Fri 10:30 Melbourne.
    # When Melbourne is on AEST (UTC+10, ~Apr–Oct), switch this line to:
    #   cron: "30 0 * * 1-5"
    # (Mon–Fri 00:30 UTC = 10:30 Melbourne AEST). Swap twice a year or accept ~1h drift.
    - cron: "30 23 * * 0-4"
  workflow_dispatch: {}

concurrency:
  group: daily-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  email-summary:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PORTFOLIO_TABLE: ${{ secrets.SUPABASE_PORTFOLIO_TABLE }}
      PORTFOLIO_CASH_USD: ${{ secrets.PORTFOLIO_CASH_USD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - uses: actions/checkout@v4

      - name: Date in Australia/Melbourne (YYYY-MM-DD)
        id: melbdate
        run: echo "d=$(TZ=Australia/Melbourne date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: sent_marker
        with:
          path: .daily-summary-sent.marker
          key: daily-summary-email-${{ steps.melbdate.outputs.d }}

      - name: Skip notice (no email this run)
        if: steps.sent_marker.outputs.cache-hit == 'true'
        run: |
          echo "Email step was SKIPPED: a send was already recorded for ${{ steps.melbdate.outputs.d }} (Australia/Melbourne)."
          echo "GitHub Actions cache prevents duplicate sends the same calendar day. Check Spam, or clear repo Actions caches / wait until tomorrow to test again."

      - name: Set up Python
        if: steps.sent_marker.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.sent_marker.outputs.cache-hit != 'true'
        run: pip install -r requirements-prod.txt

      # Fails fast with clear errors if secrets are missing (does not print values).
      - name: Verify secrets are visible to Actions
        if: steps.sent_marker.outputs.cache-hit != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PORTFOLIO_TABLE: ${{ secrets.SUPABASE_PORTFOLIO_TABLE }}
          PORTFOLIO_CASH_USD: ${{ secrets.PORTFOLIO_CASH_USD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          err=0
          check() { if [ -z "${!1:-}" ]; then echo "::error::Missing or empty GitHub Actions secret: $1 (Repository settings → Secrets and variables → Actions → Secrets)" >&2; err=1; fi; }
          check SUPABASE_URL
          if [ -z "${SUPABASE_ANON_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Set at least one of: SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY" >&2
            err=1
          fi
          check SUPABASE_PORTFOLIO_TABLE
          check PORTFOLIO_CASH_USD
          check SENDGRID_API_KEY
          check EMAIL_TO
          check EMAIL_FROM
          exit "$err"

      - name: Generate summary and send email
        if: steps.sent_marker.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python daily_summary.py | python send_email_sendgrid.py
          echo "${{ steps.melbdate.outputs.d }}" > .daily-summary-sent.marker
