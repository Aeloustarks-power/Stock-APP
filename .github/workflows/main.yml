# Daily portfolio summary email via Gmail SMTP (same folder as main.py).
#
# Multiple portfolios (same From/To): set repository variable PORTFOLIO_ID_LIST
# to comma-separated ids, e.g. "1,2,5". Each id gets one email.
# Single portfolio: set secret PORTFOLIO_ID (or a one-item list in PORTFOLIO_ID_LIST).
# Optional: omit both if your table has only one portfolio (no portfolio_id filter).
name: Daily portfolio summary

on:
  schedule:
    # Target: 22:30 (10:30 PM) Mon–Fri Australia/Melbourne (weekday nights).
    # GitHub cron is UTC-only. During AEDT (Melbourne UTC+11, ~first Sun Oct → first Sun Apr):
    #   Mon–Fri 11:30 UTC → Mon–Fri 22:30 Melbourne.
    # When Melbourne is on AEST (UTC+10, ~Apr–Oct), switch to:
    #   cron: "30 12 * * 1-5"
    # (Mon–Fri 12:30 UTC = 22:30 Melbourne AEST). Swap at DST or accept ~1h drift.
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: daily-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  email-summary:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PORTFOLIO_TABLE: ${{ secrets.SUPABASE_PORTFOLIO_TABLE }}
      PORTFOLIO_CASH_USD: ${{ secrets.PORTFOLIO_CASH_USD }}
      PORTFOLIO_ID_LIST: ${{ vars.PORTFOLIO_ID_LIST }}
      PORTFOLIO_ID: ${{ secrets.PORTFOLIO_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-prod.txt

      - name: Verify secrets are visible to Actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PORTFOLIO_TABLE: ${{ secrets.SUPABASE_PORTFOLIO_TABLE }}
          PORTFOLIO_CASH_USD: ${{ secrets.PORTFOLIO_CASH_USD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -euo pipefail
          err=0
          check() { if [ -z "${!1:-}" ]; then echo "::error::Missing or empty GitHub Actions secret: $1" >&2; err=1; fi; }
          check SUPABASE_URL
          if [ -z "${SUPABASE_ANON_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Set at least one of: SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY" >&2
            err=1
          fi
          check SUPABASE_PORTFOLIO_TABLE
          check PORTFOLIO_CASH_USD
          check GMAIL_ADDRESS
          check GMAIL_APP_PASSWORD
          check EMAIL_TO
          exit "$err"

      - name: Generate summary and send email (Gmail SMTP)
        run: |
          set -euo pipefail
          send_one() {
            echo "::notice::Sending daily summary for PORTFOLIO_ID=${PORTFOLIO_ID:-unset}"
            python daily_summary.py | python send_email_gmail.py
          }
          if [ -n "${PORTFOLIO_ID_LIST:-}" ]; then
            IFS=',' read -r -a _pids <<< "${PORTFOLIO_ID_LIST//[[:space:]]/}"
            for pid in "${_pids[@]}"; do
              [ -z "$pid" ] && continue
              export PORTFOLIO_ID="$pid"
              send_one
            done
          elif [ -n "${PORTFOLIO_ID:-}" ]; then
            export PORTFOLIO_ID
            send_one
          else
            unset PORTFOLIO_ID || true
            send_one
          fi
