# Prefer the repo-root netlify.toml.
# If Netlify base directory is set to "frontend", this file is used instead —
# do NOT set base here or builds look for frontend/frontend.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
